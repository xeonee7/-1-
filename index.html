<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>약리학 N01–N14 · 약물 → 정보</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#162033; --muted:#667085; --line:#e4e7ec;
  --ok:#15803d; --bad:#b42318; --accent:#315efb; --accentSoft:#eef2ff;
  --star:#f59e0b; --top:#fff1ed; --important:#fffbeb;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif
}
button,input{font:inherit}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 52px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 6px 22px rgba(16,24,40,.06)}
.hidden{display:none!important}
.login{max-width:440px;margin:10vh auto 0}
.idinput{width:100%;font-size:28px;letter-spacing:.35em;text-align:center;padding:16px;border:1px solid var(--line);border-radius:14px;outline:none}
.idinput:focus{border-color:#9aa9ff;box-shadow:0 0 0 3px #eef2ff}
.loginmsg{min-height:22px;color:var(--bad);font-size:13px;margin:8px 2px}
.note{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.55}
.primary,.secondary,.segbtn{
  border:0;border-radius:13px;padding:12px 15px;cursor:pointer;font-weight:750
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef0f4;color:#344054}
.smallbtn{border:0;background:transparent;color:var(--accent);padding:6px 0;cursor:pointer;font-weight:750}
.userline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.controlbox{margin:14px 0 8px;padding:13px;background:#f8fafc;border:1px solid #eef0f4;border-radius:15px}
.controlrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.controlrow+.controlrow{margin-top:10px}
.controltitle{font-size:12px;font-weight:800;color:#475467;min-width:58px}
.segment{display:flex;gap:7px;flex-wrap:wrap}
.segbtn{background:#fff;border:1px solid var(--line);color:#475467;padding:9px 11px;font-size:13px}
.segbtn.active{background:var(--accentSoft);border-color:#aab7ff;color:#294bcc}
.segbtn .count{opacity:.65;font-weight:650}
.scopebtn{max-width:100%;text-align:left}
.lecturepanel{margin:10px 0 2px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px}
.lecturepanel.hidden{display:none}
.lectureactions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.miniBtn{background:#f8fafc;border:1px solid var(--line);color:#475467;padding:7px 10px;font-size:12px}
.lecturegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lecturecheck{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid #eaecf0;border-radius:11px;background:#fff;cursor:pointer;font-size:13px;line-height:1.35}
.lecturecheck input{margin-top:2px;flex:0 0 auto}
.lecturecheck .ltxt{min-width:0;flex:1}
.lecturecheck .lcount{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.lectureapply{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.lecturemsg{font-size:12px;color:#b42318;font-weight:700}
@media(max-width:560px){.lecturegrid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:#f8fafc;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 4px}
.badge{font-size:13px;background:var(--accentSoft);padding:7px 10px;border-radius:999px}
.score{font-size:14px;color:var(--muted)}
.drugline{display:flex;align-items:flex-start;gap:10px;margin:14px 0 2px}
.drugwrap{min-width:0;flex:1}
.drug{font-size:31px;font-weight:850;letter-spacing:-.025em;word-break:break-word;line-height:1.2}
.priority{display:inline-block;margin-top:7px;font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px}
.priority.topP{background:var(--top);color:#b93815}
.priority.impP{background:var(--important);color:#a16207}
.starbtn{
  width:46px;height:46px;border:1px solid var(--line);border-radius:14px;background:#fff;
  font-size:27px;line-height:1;cursor:pointer;color:#98a2b3;flex:0 0 auto
}
.starbtn.on{color:var(--star);border-color:#fbd38d;background:#fffaf0}
.stage{font-size:16px;color:var(--muted);margin:15px 0 10px;line-height:1.5}
.contextHint{font-size:13px;color:#475467;background:#f8fafc;border-left:3px solid #c7d2fe;padding:9px 11px;border-radius:8px;margin:0 0 14px;line-height:1.5}
.opts{display:grid;gap:10px}
.opts.pptopts{grid-template-columns:1fr}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.48;cursor:pointer}
.opt:hover{border-color:#b8c3ff;background:#f8f9ff}
.opt:disabled{cursor:default;opacity:.9}
.opt.correct{border-color:#86efac;background:#f0fdf4;color:#166534}
.opt.wrong{border-color:#fda29b;background:#fff1f0;color:#b42318}
.keynum{display:inline-block;min-width:25px;font-weight:850}
.feedback{min-height:48px;margin-top:13px;font-size:15px;line-height:1.5}
.progress{height:7px;background:#eceff4;border-radius:999px;overflow:hidden;margin-top:16px}
.bar{height:100%;width:0;background:var(--accent);transition:.25s}
.path{margin-top:16px;padding:14px;background:#f8fafc;border-radius:14px;font-size:14px;line-height:1.65;display:none}
.actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
.actions .primary{flex:1;min-width:150px}
.actions .secondary{font-size:13px}
.history{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.history h3{font-size:15px;margin:0 0 8px}
.histrow{font-size:13px;padding:8px 0;border-bottom:1px solid #f0f2f5;line-height:1.45}
.modepill{font-size:12px;color:#475467;margin-top:4px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.roundcard{width:min(440px,100%);background:#fff;border-radius:24px;padding:30px 24px;text-align:center;box-shadow:0 24px 80px rgba(15,23,42,.22)}
.roundicon{width:66px;height:66px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#315efb;font-size:32px;font-weight:900}
.roundtitle{font-size:29px;font-weight:900;letter-spacing:-.03em}
.roundsub{margin:8px 0 20px;color:var(--muted);font-size:14px;line-height:1.55}
.roundcard .primary{width:100%}
.creator-watermark{position:fixed;right:14px;bottom:10px;z-index:1000;font-size:12px;font-weight:600;color:rgba(80,80,80,.28);letter-spacing:.02em;pointer-events:none;user-select:none}
@media(max-width:560px){
  .card{padding:17px}.drug{font-size:26px}.opt{padding:13px 14px}
  .stats{gap:6px}.stat{padding:10px 6px}.stat b{font-size:18px}
  .controltitle{width:100%;min-width:0}.controlrow{align-items:flex-start}
  .opts.pptopts{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="wrap login" id="modeScreen">
  <h1>약리학 N01–N14 퀴즈</h1>
  <div class="sub">훈련 방향을 선택해.</div>
  <div class="card">
    <div class="segment" style="display:grid;grid-template-columns:1fr;gap:12px">
      <button class="segbtn" id="chooseForwardBtn" style="padding:18px 16px;text-align:left">
        <b>약물 → 정보</b><br>
        <span class="count">약물을 보고 분류·기전·적응증·핵심 특징 맞히기</span>
      </button>
      <button class="segbtn" id="chooseReverseBtn" style="padding:18px 16px;text-align:left">
        <b>정보 → 약물</b><br>
        <span class="count">적응증/약물 특징 1줄을 보고 해당 약물 맞히기</span>
      </button>
    </div>
  </div>
</div>

<div class="wrap hidden" id="quizScreen">
  <h1 id="quizTitle">약리학 N01–N14</h1>
  <div class="sub" id="quizSub"></div>

  <div class="card">
    <div class="userline">
      <span id="currentModeText">현재 모드</span>
      <button class="smallbtn" id="modeChangeBtn">모드 변경</button>
    </div>

    <div class="controlbox">
      <div class="controlrow">
        <div class="controltitle">강의 범위</div>
        <div class="segment">
          <button class="segbtn scopebtn" id="lectureScopeBtn"><span id="lectureScopeText">전체 강의</span> ▾</button>
        </div>
      </div>
      <div class="lecturepanel hidden" id="lecturePanel">
        <div class="lectureactions">
          <button class="miniBtn" id="selectAllLecturesBtn" type="button">전체 선택</button>
          <button class="miniBtn" id="clearAllLecturesBtn" type="button">전체 해제</button>
        </div>
        <div class="lecturegrid" id="lectureChecks"></div>
        <div class="lectureapply">
          <button class="primary" id="applyLecturesBtn" type="button">선택 범위 적용</button>
          <span class="lecturemsg" id="lectureMsg"></span>
        </div>
      </div>
      <div class="controlrow">
        <div class="controltitle">암기 우선순위 <span style="font-size:11px;color:#b42318">시험 직전 추천: 마지막40 → 초핵심96</span></div>
        <div class="segment">
          <button class="segbtn" id="red40Btn">🔥 마지막 40 <span class="count" id="red40Count"></span></button>
          <button class="segbtn" id="ultra96Btn">⚡ 초핵심 96 <span class="count" id="ultra96Count"></span></button>
          <button class="segbtn" id="topOnlyBtn">최우선만 <span class="count" id="topOnlyCount"></span></button>
          <button class="segbtn" id="topImportantBtn">최우선 + 중요 <span class="count" id="topImportantCount"></span></button>
        </div>
      </div>
      <div class="controlrow" id="studyLevelRow">
        <div class="controltitle">학습 단계</div>
        <div class="segment">
          <button class="segbtn" data-level="intermediate" id="intermediateBtn">중급 <span class="count">분류·기전</span></button>
          <button class="segbtn" data-level="practical" id="practicalBtn">실전 <span class="count">+ 적응증·한 줄</span></button>
        </div>
      </div>
      <div class="controlrow">
        <div class="controltitle">문제 모드</div>
        <div class="segment">
          <button class="segbtn" data-mode="all" id="allModeBtn">전체 <span class="count" id="allCount"></span></button>
          <button class="segbtn" data-mode="favorite" id="favoriteModeBtn">★ 즐겨찾기 <span class="count" id="favoriteCount"></span></button>
          <button class="segbtn" data-mode="wrong" id="wrongModeBtn">오답만 <span class="count" id="wrongCount"></span></button>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><b id="roundStat">1</b><span>회독</span></div>
      <div class="stat"><b id="completedRoundStat">0</b><span>이번 회독 완료</span></div>
      <div class="stat"><b id="remainingStat">0</b><span>남은 항목</span></div>
    </div>

    <div class="top">
      <div class="badge" id="badge">학습 시작</div>
      <div class="score" id="score">정답 0 / 0</div>
    </div>

    <div class="drugline">
      <div class="drugwrap">
        <div class="drug" id="drug"></div>
        <div class="priority" id="priorityBadge"></div>
        <div class="modepill" id="modePill"></div>
      </div>
      <button class="starbtn" id="starBtn" title="즐겨찾기" aria-label="즐겨찾기">☆</button>
    </div>

    <div class="stage" id="stage"></div>
    <div class="contextHint hidden" id="contextHint"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>

    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="path" id="path"></div>

    <div class="actions">
      <button class="secondary" id="resetBtn">현재 모드 기록 초기화</button>
      <button class="primary" id="nextBtn" style="display:none">다음 항목</button>
    </div>

    <div class="history">
      <h3>최근 완료 기록</h3>
      <div id="historyBox"></div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="roundOverlay">
  <div class="roundcard">
    <div class="roundicon">✓</div>
    <div class="roundtitle" id="roundDoneTitle">1회독 끝!</div>
    <div class="roundsub" id="roundDoneSub"></div>
    <button class="primary" id="nextRoundBtn">다음 회독 시작</button>
  </div>
</div>

<script>
let appMode=null; // "forward" | "reverse"

const $=id=>document.getElementById(id);
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function unique(arr){ return [...new Set(arr.filter(x=>x!==undefined && x!==null && x!==""))]; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function storageKey(){
  return appMode==="reverse" ? "pharmInfoToDrug:v2:default" : "pharmDrugToInfo:v2:default";
}
function safeGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return memoryStorage[key] ?? null; }
}
function safeSet(key,val){
  try{ localStorage.setItem(key,val); }catch(e){ memoryStorage[key]=val; }
}
function safeRemove(key){
  try{ localStorage.removeItem(key); }catch(e){ delete memoryStorage[key]; }
}

function emptyRecord(){
  return {
    correct:0, attempts:0, completed:0,
    favorites:[], wrongIds:[], completedHistory:[],
    settings:{importance:"topImportant",mode:"all",studyLevel:"intermediate",selectedPpts:[...PPTS]},
    contexts:{},
    lastOpened:new Date().toISOString()
  };
}
function normalizeRecord(obj){
  const r=(obj && typeof obj==="object")?obj:emptyRecord();
  r.correct=Number(r.correct||0);
  r.attempts=Number(r.attempts||0);
  r.completed=Number(r.completed||0);
  if(!Array.isArray(r.favorites)) r.favorites=[];
  if(!Array.isArray(r.wrongIds)) r.wrongIds=[];
  if(!Array.isArray(r.completedHistory)) r.completedHistory=[];
  if(!r.settings || typeof r.settings!=="object") r.settings={importance:"topImportant",mode:"all",studyLevel:"intermediate",selectedPpts:[...PPTS]};
  if(!["red40","ultra96","topOnly","topImportant"].includes(r.settings.importance)) r.settings.importance="ultra96";
  if(!["all","favorite","wrong"].includes(r.settings.mode)) r.settings.mode="all";
  if(r.settings.studyLevel==="beginner") r.settings.studyLevel="intermediate";
  if(!["intermediate","practical"].includes(r.settings.studyLevel)) r.settings.studyLevel="intermediate";
  if(!Array.isArray(r.settings.selectedPpts)) r.settings.selectedPpts=[...PPTS];
  const savedPpts=[...new Set(r.settings.selectedPpts.filter(p=>PPTS.includes(p)))];
  const wasLegacyAll = LEGACY_ALL_SETS.some(set =>
    savedPpts.length===set.length && set.every(p=>savedPpts.includes(p))
  );
  r.settings.selectedPpts=wasLegacyAll ? [...PPTS] : savedPpts;
  if(!r.settings.selectedPpts.length) r.settings.selectedPpts=[...PPTS];
  if(!r.contexts || typeof r.contexts!=="object") r.contexts={};

  // Cyproheptadine N01/N02 병합 migration
  const oldCyproIds=new Set(["N01::Cyproheptadine::22","N02::Cyproheptadine::13"]);
  const mergedCyproId="N01-N02::Cyproheptadine";
  r.favorites=unique(r.favorites.map(id=>oldCyproIds.has(id)?mergedCyproId:id));
  r.wrongIds=unique(r.wrongIds.map(id=>oldCyproIds.has(id)?mergedCyproId:id));
  for(const c of Object.values(r.contexts)){
    if(!c || typeof c!=="object") continue;
    if(Array.isArray(c.deck)) c.deck=unique(c.deck.map(id=>oldCyproIds.has(id)?mergedCyproId:id));
    if(oldCyproIds.has(c.currentUid)) c.currentUid=mergedCyproId;
  }
  r.completedHistory=(r.completedHistory||[]).map(x=>{
    if(x && oldCyproIds.has(x.id)) return {...x,id:mergedCyproId,topic:"항히스타민제 / 브라디키닌 + 세로토닌 / Ergot alkaloid"};
    return x;
  });
  return r;
}
function loadRecord(){
  try{
    const raw=safeGet(storageKey());
    return normalizeRecord(raw?JSON.parse(raw):emptyRecord());
  }catch(e){ return emptyRecord(); }
}
function saveRecord(){
  if(!record || !appMode) return;
  record.lastOpened=new Date().toISOString();
  safeSet(storageKey(),JSON.stringify(record));
  updateUi();
}
function lectureSelectionKey(ppts=record.settings.selectedPpts){
  return [...ppts].sort().join(",");
}
function contextKey(
  importance=record.settings.importance,
  mode=record.settings.mode,
  studyLevel=record.settings.studyLevel,
  selectedPpts=record.settings.selectedPpts
){
  return `${appMode||"forward"}|${importance}|${mode}|${studyLevel}|${lectureSelectionKey(selectedPpts)}`;
}
function getContext(key=contextKey()){
  if(!record.contexts[key]){
    record.contexts[key]={
      round:1,deck:[],currentUid:null,stage:firstActiveStage(),currentHadWrong:false,
      reverseClueType:null,reverseHintShown:false,
      completedThisRound:0,roundTotal:0,awaitingNextRound:false
    };
  }
  const c=record.contexts[key];
  c.round=Number(c.round||1);
  if(!Array.isArray(c.deck)) c.deck=[];
  c.currentUid ??= null;
  c.stage=Number(c.stage||firstActiveStage());
  if(!activeStages().includes(c.stage)) c.stage=firstActiveStage();
  c.currentHadWrong=!!c.currentHadWrong;
  c.reverseClueType = c.reverseClueType || null;
  c.reverseHintShown=!!c.reverseHintShown;
  c.completedThisRound=Number(c.completedThisRound||0);
  c.roundTotal=Number(c.roundTotal||0);
  c.awaitingNextRound=!!c.awaitingNextRound;
  return c;
}

function drugPpts(d){
  return Array.isArray(d?.ppts) && d.ppts.length ? d.ppts : [d.ppt];
}
function drugTopicText(d){
  return drugPpts(d).map(topicLabel).join(" + ");
}
function sharesLecture(a,b){
  const bs=new Set(drugPpts(b));
  return drugPpts(a).some(p=>bs.has(p));
}
function lecturePool(selectedPpts=record.settings.selectedPpts){
  const selected=new Set(selectedPpts);
  return drugs.filter(d=>drugPpts(d).some(p=>selected.has(p)));
}
function importancePool(importance=record.settings.importance,selectedPpts=record.settings.selectedPpts){
  const scoped=lecturePool(selectedPpts);
  if(importance==="red40") return scoped.filter(d=>d.examTier==="red40");
  if(importance==="ultra96") return scoped.filter(d=>d.examTier==="red40" || d.examTier==="ultra96");
  if(importance==="topOnly") return scoped.filter(d=>d.priority==="최우선");
  return scoped;
}
function getPool(
  importance=record.settings.importance,
  mode=record.settings.mode,
  selectedPpts=record.settings.selectedPpts
){
  let pool=importancePool(importance,selectedPpts);

  if(appMode==="reverse"){
    pool=pool.filter(d=>d.priority==="최우선" || d.examTier==="red40" || d.examTier==="ultra96");
    pool=uniqueDrugRowsByName(pool);
  }

  if(mode==="favorite"){
    const s=new Set(record.favorites);
    pool=pool.filter(d=>s.has(d.id));
  }else if(mode==="wrong"){
    const s=new Set(record.wrongIds);
    pool=pool.filter(d=>s.has(d.id));
  }
  return pool;
}

const REVERSE_CURATED_LINES={"Astemizole":"구 2세대 H1 약; 긴 반감기와 QT 연장/부정맥 위험이 시험 포인트.","Cetirizine":"2세대 H1 차단제; 알레르기 효과는 좋지만 다른 2세대보다 약간의 진정이 남을 수 있다.","Cimetidine":"H2 antagonist; 위산분비 억제 + CYP450 억제 + antiandrogen 효과(gynecomastia)가 대표 함정.","Cromolyn sodium":"mast-cell stabilizer로 알레르기/천식 예방에 사용하며 급성 기관지연축 치료약은 아니다.","Cyproheptadine":"1세대 H1+5-HT2 antagonist; 식욕증진과 중증 serotonin syndrome 치료가 대표 포인트.","Dimenhydrinate":"diphenhydramine 기반 1세대 H1 약; 멀미 예방·치료에 사용하며 진정이 흔하다.","Diphenhydramine":"1세대 H1 차단제; 강한 진정·항무스카린 작용, 급성 dystonia/EPS 완화에도 사용.","Ecallantide":"plasma kallikrein inhibitor; hereditary angioedema 급성발작에 사용.","Epinephrine":"아나필락시스 1차 치료; α1 혈관수축+β2 기관지확장으로 histamine 효과를 빠르게 역전.","Fexofenadine":"2세대 H1 차단제; 진정이 거의 없고 terfenadine의 활성대사체라 QT/CYP 문제를 크게 줄였다.","Icatibant":"bradykinin B2 receptor antagonist; hereditary angioedema 급성발작 치료.","Lanadelumab":"kallikrein을 표적하는 mAb; hereditary angioedema의 장기 예방에 사용.","Loratadine":"2세대 H1 차단제; 알레르기에 쓰며 1세대보다 진정이 훨씬 적다.","Meclizine":"1세대 H1+항무스카린; 멀미·전정성 현훈에 쓰고 비교적 지속시간이 길다.","Nizatidine":"H2 antagonist; 위산분비 억제, cimetidine과 달리 CYP/antiandrogen 문제가 거의 없다.","Pitolisant":"H3 inverse agonist/antagonist로 histamine 방출을 늘려 기면증의 각성 유지에 사용.","Prednisone":"중간작용 glucocorticoid prodrug; 간에서 prednisolone으로 전환되며 장기 사용 시 HPA suppression을 기억.","Promethazine":"강한 진정성 1세대 H1 약; 멀미·오심/구토에 쓰며 항무스카린 효과도 크다.","Scopolamine":"중추 muscarinic antagonist; 멀미 예방에 가장 강력한 약물 중 하나로 항콜린 부작용을 기억.","Terfenadine":"구 2세대 H1 약; CYP3A4 억제 시 QT 연장·torsades 위험 때문에 사실상 퇴출된 약.","Tubocurarine":"amine류; 세포내 heparin-protein complex로부터 histamine 유리.","Vancomycin":"항생제; 약물에 의한 histamine 유리의 대표 예.","Bromocriptine":"ergot계 D2 agonist; prolactin 억제에 사용하며 Parkinson/acromegaly에도 연결.","Buspirone":"5-HT1A partial agonist; 비진정성 항불안제로 즉효성이 없고 benzodiazepine 대체축.","Cabergoline":"장시간 D2 agonist; hyperprolactinemia에 대표적으로 쓰며 고용량 장기 사용 시 판막병증 주의.","Cisapride":"5-HT4 agonist prokinetic; QT 연장·치명적 부정맥 때문에 사용이 크게 제한된 약.","Ergonovine":"강한 자궁수축 ergot; 산후출혈 치료/관상연축 유발시험에 사용, 고혈압 주의.","Ergotamine":"강력하고 지속적인 혈관수축을 일으키는 ergot; 편두통에 쓰지만 허혈·ergotism 위험.","LSD":"합성 ergot 화합물; 중추 5-HT2A partial agonist로 강한 환각을 유발.","Methysergide":"5-HT2 길항성 ergot 유도체; 편두통 예방에 쓰였지만 retroperitoneal fibrosis 때문에 거의 사용하지 않음.","Ondansetron":"5-HT3 antagonist; 항암·수술 후 오심/구토에 사용하며 QT 연장 가능.","Sumatriptan":"5-HT1B/1D agonist; 급성 편두통에서 두개혈관 수축·CGRP 분비 억제, 관상동맥질환엔 주의.","Alprostadil":"PGE1; PDA 유지와 발기부전 치료가 대표 적응증.","Aspirin":"COX를 비가역적으로 acetylation; 혈소판은 새 COX를 못 만들어 항혈소판 효과가 수명 동안 지속.","Celecoxib":"선택적 COX-2 inhibitor; GI 독성은 줄지만 혈소판 보호효과는 없고 CV risk를 기억.","Dinoprostone":"PGE2 제제; 자궁경부 숙화와 분만 유도에 사용.","Epoprostenol":"PGI2 analog; 강력한 혈관확장·혈소판 억제로 pulmonary arterial hypertension 치료.","Glucocorticoids":"PLA2 억제·COX-2 발현 감소로 eicosanoid 생성을 상류에서 차단하는 강력한 항염증 약물.","Misoprostol":"PGE1 analog; NSAID 유발 위궤양 예방 + 자궁수축, 임신중절에서 mifepristone과 병용.","Montelukast":"CysLT1 receptor antagonist; 천식·알레르기 비염, 운동유발 기관지수축에 사용.","Zafirlukast":"CysLT1 receptor antagonist; 천식 유지치료에 사용하며 급성 발작 치료약은 아님.","Zileuton":"5-lipoxygenase inhibitor로 leukotriene 합성을 차단; 간독성/간기능 모니터링이 중요.","Aliskiren":"직접 renin inhibitor; RAAS의 가장 상류를 차단하지만 임신 금기·hyperkalemia에 주의.","Captopril":"ACE inhibitor; Ang II↓+bradykinin↑로 기침/angioedema, hyperK·임신금기가 핵심.","Carperitide":"recombinant ANP; natriuresis·vasodilation으로 급성 심부전에서 사용되는 일본계 약.","Conivaptan":"V1a/V2 antagonist; 입원 환자의 euvolemic/hypervolemic hyponatremia에 IV 사용.","Desmopressin (DDAVP)":"V2-selective agonist; central DI·야뇨증·vWD/hemophilia A에서 사용, hyponatremia 주의.","Enalapril":"ACE inhibitor prodrug; 심부전/고혈압에 사용, class effect로 기침·angioedema·hyperK.","Losartan":"AT1 receptor blocker; ACEI와 비슷한 RAAS 효과지만 bradykinin 기침이 적다.","Nesiritide":"recombinant BNP; vasodilation/natriuresis로 급성 심부전에서 사용, 저혈압이 문제.","Tolvaptan":"선택적 V2 antagonist; SIADH의 저나트륨혈증·ADPKD에 사용, 간독성과 빠른 Na 교정 주의.","Aspirin (ASA)":"비가역 COX 억제 + 저용량 항혈소판; salicylism·Reye syndrome·위장관 출혈을 기억.","Diflunisal":"salicylate계 진통제지만 aspirin과 달리 항혈소판 목적의 비가역 COX 억제약은 아니다.","Etoricoxib":"COX-2 선택적 NSAID; GI 독성은 적지만 심혈관 위험 때문에 환자 선택이 중요.","Fenoprofen":"propionic acid계 비선택 NSAID; 일반 NSAID의 GI·신장 독성을 공유.","Indomethacin":"강력한 비선택 NSAID; 급성 통풍·PDA 폐쇄에 쓰지만 CNS/GI 독성이 커 장기 1차약은 아님.","Ketorolac":"강력한 진통성 NSAID; opioid 대체 진통에 유용하지만 GI/신장 독성 때문에 단기간(≤5일) 사용.","Meloxicam":"COX-2 선호성 NSAID; celecoxib만큼 선택적이지 않으며 GI/신장 위험은 남아 있다.","Nabumetone":"비산성 prodrug NSAID; 활성대사체가 COX를 억제하며 상대적으로 GI 자극이 적다.","Naproxen":"비선택 NSAID; 비교적 긴 반감기, CV risk가 다른 NSAID보다 낮게 평가되는 편.","Phenylbutazone":"강한 NSAID지만 aplastic anemia/agranulocytosis 같은 심각한 독성 때문에 사람에서 거의 사용하지 않음.","Polmacoxib":"국내 개발 coxib; COX-2 선택 억제로 osteoarthritis에 사용.","Rofecoxib":"COX-2 선택 억제제였지만 심혈관 사건 증가로 시장 철수된 대표 coxib.","Valdecoxib":"COX-2 선택 억제제; 심혈관·중증 피부반응 문제로 철수된 약.","Abatacept":"CTLA4-Ig; CD80/86을 막아 T-cell costimulation을 차단하는 RA biologic.","Acetaminophen":"해열·진통은 강하지만 항염은 약함; 과량 시 NAPQI 축적→간괴사, 해독제 NAC.","Adalimumab":"완전 human anti-TNF-α mAb; RA/IBD/건선 등에 사용, latent TB/HBV 선별 필수.","Allopurinol":"xanthine oxidase inhibitor; 만성 hyperuricemia, 6-MP/azathioprine 용량감량 필요, HLA-B*58:01 과민반응.","Anakinra":"IL-1 receptor antagonist; RA보다 autoinflammatory disease에 더 자주 연상, 짧은 반감기·감염 주의.","Baricitinib":"JAK1/2 inhibitor; 경구 RA 약, 심각한 감염·혈전·심혈관 위험 경고.","Canakinumab":"anti-IL-1β mAb; CAPS/자가염증질환·일부 gout 상황, 장시간 작용.","Certolizumab":"PEGylated anti-TNF Fab′로 Fc가 없어 태반통과가 상대적으로 적은 anti-TNF.","Colchicine":"microtubule 중합 억제로 neutrophil 염증반응↓; 급성 통풍·FMF, GI 독성과 골수억제 주의.","Cyclosporine":"calcineurin inhibitor; T-cell cytokine 생성 억제, nephrotoxicity·HTN·상호작용을 기억.","Etanercept":"soluble TNF receptor-Fc fusion protein; RA 등에서 TNF를 잡아내며 latent TB 감염 주의.","Febuxostat":"비purine xanthine oxidase inhibitor; 만성 통풍, 심혈관 안전성 이슈를 기억.","Folic acid":"MTX 치료에서 구내염·GI·골수독성 등 folate-related toxicity를 줄이기 위해 병용.","Golimumab":"human anti-TNF mAb; RA/UC 등에 사용, 다른 TNF 억제제처럼 감염·TB 위험.","Hydroxychloroquine":"RA/SLE csDMARD; retinal toxicity가 핵심이라 정기 안과검사가 필요.","Infliximab":"chimeric anti-TNF mAb; RA/IBD 등에 사용하며 infusion reaction·항약물항체·TB 재활성화 주의.","Leflunomide":"DHODH 억제로 pyrimidine 합성↓; RA에 사용, 간독성·기형유발로 임신금기.","Methotrexate (MTX)":"RA 대표 1차 csDMARD; 주 1회 투여, folate 보충, 간독성·골수억제·임신금기.","N-Acetylcysteine (NAC)":"acetaminophen 중독의 해독제; glutathione을 보충하고 NAPQI 해독을 촉진.","Pegloticase":"PEGylated uricase; 불응성 중증 통풍에서 uric acid→allantoin, infusion reaction/과민반응.","Probenecid":"URAT1 등 요산 재흡수 억제→요산배설↑; 신결석·약물배설 상호작용을 기억.","Rasburicase":"recombinant uricase; tumor lysis syndrome의 고요산혈증에 사용, G6PD deficiency 금기.","Rituximab":"anti-CD20 mAb; B cell 제거, RA/림프종 등에 사용하며 infusion reaction·HBV reactivation 주의.","Tocilizumab":"anti-IL-6 receptor mAb; TNF 억제 불응 RA 등에 사용, 감염·간효소·lipid 증가·GI perforation 주의.","Tofacitinib":"JAK inhibitor; 경구 RA/UC 약, zoster·감염·혈전/심혈관·악성종양 위험을 기억.","Upadacitinib":"선택적 JAK1 inhibitor; RA/염증성 질환에 사용, class boxed warning을 공유.","Lanreotide":"long-acting somatostatin analog; acromegaly·neuroendocrine tumor에 사용.","Liraglutide":"GLP-1 RA; 혈당↓·체중감소, gastric emptying↓·식욕↓, GI 부작용이 흔함.","Mecasermin":"recombinant IGF-1; GH receptor defect(Laron syndrome)처럼 GH에 반응 못할 때 사용.","Octreotide":"somatostatin analog; acromegaly·carcinoid/VIPoma·variceal bleeding 등에 사용, 담석/혈당변화 주의.","Orlistat":"위장관 lipase 억제→지방흡수↓; steatorrhea와 지용성 비타민 결핍이 대표 부작용.","Pegvisomant":"GH receptor antagonist; acromegaly 치료, GH가 아니라 IGF-1로 효과를 추적.","Semaglutide":"장시간 GLP-1 RA; 강력한 혈당·체중 감소, GI 증상과 담낭/췌장 관련 주의.","Sermorelin":"GHRH analog; GH 분비를 자극하는 진단/치료용 약으로 현재 사용은 제한적.","Somatostatin":"GH·TSH·인슐린·글루카곤 등 여러 호르몬 분비 억제; 반감기가 짧아 임상은 analog를 주로 사용.","Somatropin":"recombinant GH; GH deficiency·Turner 등 성장장애에 사용, hyperglycemia·intracranial HTN 주의.","Tirzepatide":"GIP+GLP-1 dual agonist; 매우 강한 혈당·체중 감소 효과가 핵심.","High-dose iodide":"organification/release를 빠르게 억제(Wolff-Chaikoff); thyroid storm에서 thioamide 후 투여.","Levothyroxine (LT4)":"hypothyroidism 1차 치료; 긴 반감기, 공복 복용·철/칼슘과 간격을 기억.","Liothyronine (LT3)":"빠르고 짧게 작용하는 T3; myxedema coma 등 특수 상황, 심장 부작용 위험.","Methimazole":"TPO 억제로 thyroid hormone 합성↓; agranulocytosis, 임신 1삼분기는 PTU 선호.","Perchlorate":"NIS에서 iodide와 경쟁해 trapping을 억제; 드물게 갑상샘기능항진/오염 iodine 상황에 사용.","Pertechnetate":"NIS로 갑상샘에 포획되지만 organification되지 않아 thyroid scan에 이용.","Propranolol":"thyrotoxicosis 증상 조절 + 고용량에서 T4→T3 전환 억제; thyroid storm 보조치료.","Propylthiouracil (PTU)":"TPO 억제 + peripheral T4→T3 전환 억제; thyroid storm·임신 1삼분기, 심한 hepatotoxicity 주의.","Radioactive iodine (¹³¹I)":"β선으로 thyroid follicular cell 파괴; 임신·수유 금기, 이후 hypothyroidism 흔함.","Thiocyanate":"NIS를 경쟁 억제하는 anion; iodide uptake 감소의 고전적 약리 포인트.","Anastrozole":"비steroidal reversible aromatase inhibitor; 폐경 후 ER+ breast cancer, bone loss 주의.","Bicalutamide":"nonsteroidal AR antagonist; prostate cancer에서 androgen blockade, gynecomastia·간독성 주의.","Clomiphene":"시상하부 ER 차단→GnRH/LH/FSH↑로 ovulation induction.","Degarelix":"GnRH antagonist; flare 없이 즉시 testosterone 억제, prostate cancer에 사용.","Dutasteride":"5α-reductase type 1+2 억제→DHT 더 강하게 감소; BPH·탈모.","Enzalutamide":"강력한 AR signaling inhibitor; mCRPC 등에 사용, seizure risk가 대표 포인트.","Estradiol (E2)":"가장 강력한 주요 endogenous estrogen; 가임기 난소 estrogen의 중심.","Estriol (E3)":"가장 약한 주요 endogenous estrogen; 임신에서 증가하며 태반-태아 단위와 연결.","Estrone (E1)":"주로 폐경 후 우세한 endogenous estrogen; E2보다 약하고 E3보다 강하다.","Ethinyl estradiol":"17α-ethinyl기로 초회통과 대사에 강해 경구피임약의 대표 estrogen 성분.","Exemestane":"steroidal irreversible aromatase inhibitor(suicide inhibitor); 폐경 후 ER+ breast cancer.","Finasteride":"5α-reductase type 2 억제→DHT↓; BPH·남성형 탈모, 임신 여성은 분쇄정 접촉 주의.","Fulvestrant":"SERD; ER을 길항하고 분해시켜 ER+ breast cancer에 사용.","Letrozole":"aromatase inhibitor; breast cancer 외 배란유도에도 사용되는 대표 AI.","Leuprolide":"GnRH agonist; 연속투여 시 initial flare 후 receptor downregulation→성선기능 억제.","Levonorgestrel":"progestin; 피임/IUD 및 응급피임 1.5 mg의 대표 약.","Mifepristone (RU-486)":"PR+GR antagonist; 임신중절에서 misoprostol과 병용, Cushing hyperglycemia에도 사용.","Norethindrone":"progestin; 피임·비정상 자궁출혈 등에 사용, androgenic effect가 비교적 존재.","Progesterone":"PR agonist; endometrium secretory transformation·임신 유지, estrogen 단독 HRT의 endometrial risk를 줄임.","Progestin-only pill (mini pill)":"주로 cervical mucus·endometrium 변화로 피임; estrogen 금기 환자에 유용, 복용시간 엄격.","Raloxifene":"SERM; 뼈 agonist, 유방·자궁 antagonist→골다공증+유방암 위험↓, endometrial cancer 증가는 적음.","Spironolactone":"MR antagonist이면서 antiandrogen; hyperK + gynecomastia/menstrual irregularity.","Tamoxifen":"SERM; breast ER antagonist지만 자궁·뼈에는 agonist 성향→endometrial cancer·VTE 위험.","Testosterone":"androgen receptor agonist; 남성 성선기능저하 대치, 5α-reductase로 DHT 전환.","Ulipristal acetate":"selective PR modulator; 응급피임을 성교 후 최대 5일 내 사용.","복합 경구피임약 (Estrogen + progestin)":"LH/FSH 및 LH surge 억제 + cervical mucus 변화; VTE 위험·흡연 고령 여성 주의.","Abaloparatide":"PTHrP analog; 간헐적 PTH1 receptor 자극으로 bone anabolic effect.","Alendronate":"경구 nitrogen bisphosphonate; 공복 물로 복용 후 30분 눕지 않기.","Bisphosphonates":"hydroxyapatite에 결합해 osteoclast 억제; osteoporosis 1차축, esophagitis·ONJ·atypical femur fracture.","Burosumab":"anti-FGF23 mAb; X-linked hypophosphatemia에서 phosphate wasting을 교정.","Calcitonin":"osteoclast 억제·Ca↓; Paget/hypercalcemia·acute vertebral fracture pain에 제한적으로 사용.","Calcitriol (1,25(OH)₂D)":"활성 vitamin D; Ca/P 흡수↑, CKD hypocalcemia/secondary hyperPTH에 사용.","Calcium gluconate":"symptomatic hypocalcemia·hyperK 심근막 안정화에 IV 사용; calcium chloride보다 말초 자극이 적다.","Cinacalcet":"CaSR agonist(calcimimetic); PTH↓, secondary hyperPTH/일부 hypercalcemia에 사용, hypocalcemia 주의.","Denosumab":"anti-RANKL mAb; 강력한 antiresorptive, 중단 시 rebound bone loss·vertebral fracture 때문에 전환치료 필요.","Estrogen":"bone resorption 억제하지만 VTE/암/심혈관 위험 때문에 osteoporosis 단독 목적으로는 제한.","FGF23":"bone-derived hormone; renal phosphate reabsorption↓ + 1α-hydroxylase↓→phosphate↓·calcitriol↓.","Pamidronate":"IV nitrogen bisphosphonate; hypercalcemia of malignancy·Paget 등에서 사용.","PTH":"혈중 Ca↑·phosphate↓; 신장 Ca 재흡수↑/P 배설↑/1α-hydroxylase↑, 지속 상승은 bone resorption 우세.","Romosozumab":"anti-sclerostin; bone formation↑+resorption↓의 이중효과, 12개월 제한·CV warning.","Sevelamer":"비흡수성 phosphate binder; CKD hyperphosphatemia에 사용, Ca를 포함하지 않는다.","Teriparatide":"PTH(1-34); 간헐 투여 시 osteoblast 우세로 bone formation↑, 골절 고위험 osteoporosis.","Vitamin D (D2/D3)":"장 Ca/P 흡수↑; 결핍 시 osteomalacia/rickets, 과량은 hypercalcemia.","Zoledronate":"강력한 IV bisphosphonate; osteoporosis yearly dosing/악성종양성 hypercalcemia, renal function 확인.","11β-HSD2":"신장/태반에서 cortisol→cortisone; MR을 cortisol로부터 보호하고 태아 GC 노출을 줄인다.","Aldosterone":"MR→ENaC/Na-K ATPase↑로 Na retention·K/H excretion; Ang II와 K+가 주조절.","Aminoglutethimide":"P450scc 및 aromatase 억제; 오래된 steroid synthesis inhibitor.","Betamethasone":"강력 장시간 GC; 태반 11β-HSD2에 잘 안 깨져 fetal lung maturation에 사용.","Dexamethasone":"강력·장시간 GC, MC 작용 거의 0; dex suppression test·fetal lung maturation에 활용.","Eplerenone":"선택적 MR antagonist; spironolactone보다 gynecomastia 적고 hyperK는 여전히 중요.","Etomidate":"IV anesthetic이면서 CYP11B 억제; 중증 Cushing에서 빠른 cortisol control에 활용 가능.","Fludrocortisone":"매우 강한 mineralocorticoid; Addison/orthostatic hypotension, HTN·edema·hypokalemia 주의.","Hydrocortisone (Cortisol)":"physiologic GC+일부 MC; acute adrenal crisis의 IV 1차 steroid이자 Addison replacement.","Ketoconazole":"CYP17 중심의 steroidogenesis 억제; Cushing 치료에 쓰지만 hepatotoxicity·CYP interaction이 큼.","Metyrapone":"11β-hydroxylase inhibitor→cortisol↓·11-deoxycortisol↑; Cushing 진단/치료.","Mifepristone":"GR+PR antagonist; Cushing syndrome의 hyperglycemia 개선과 임신중절에 사용.","Mitotane":"adrenolytic DDT 유도체; unresectable adrenocortical carcinoma의 대표 약.","P450scc (CYP11A)":"cholesterol→pregnenolone의 steroidogenesis 첫 단계 효소; StAR가 cholesterol을 mitochondria로 운반.","Prednisolone":"중간작용 GC; prednisone의 활성형, 임신 중 maternal disease에서 placental inactivation 때문에 선호.","Trilostane":"3β-HSD inhibitor; steroid 합성 억제, 현재 사람보다 canine Cushing에서 유명.","Acarbose":"intestinal α-glucosidase inhibitor→탄수화물 흡수 지연; GI 부작용, 저혈당 시 glucose로 교정.","Canagliflozin / Empagliflozin / Dapagliflozin":"SGLT2 inhibitor→glycosuria; HF/CKD benefit, genital infection·volume loss·euglycemic DKA.","Diazoxide":"KATP opener; β세포 hyperpolarization→insulin 분비 억제, hyperinsulinemic hypoglycemia에 사용.","Glucagon":"Gs-cAMP로 hepatic glycogenolysis/gluconeogenesis↑; severe hypoglycemia·β-blocker overdose에 사용.","Insulin":"β세포 KATP 폐쇄→Ca influx로 분비, 수용체는 RTK; GLUT4 translocation과 anabolic metabolism 촉진.","Insulin aspart":"rapid-acting insulin analog; 식사 직전 투여, basal insulin과 조합.","Insulin degludec":"ultra-long basal insulin; 매우 긴 반감기·평탄한 profile로 투여시간 유연.","Insulin glargine":"long-acting peakless basal insulin; 산성 용액이 피하에서 침전, 다른 insulin과 혼합 X.","Insulin icodec":"주 1회 basal insulin; albumin 결합을 이용한 초장시간 제제.","Insulin lispro":"rapid-acting insulin analog; 식후 혈당 조절, onset 빠르고 duration 짧다.","Metformin":"AMPK 중심으로 hepatic gluconeogenesis↓; 저혈당/체중증가 적고 renal dysfunction에서 lactic acidosis 주의.","Nateglinide":"짧고 빠른 meglitinide; postprandial glucose에 초점, 식사 건너뛰면 복용도 건너뜀.","NPH (isophane) insulin":"intermediate-acting protamine insulin; 뚜렷한 peak가 있어 nocturnal hypoglycemia 주의, 일부 insulin과 혼합 가능.","Pioglitazone":"PPARγ agonist→insulin sensitivity↑; edema·weight gain·HF·fracture 주의.","Regular insulin":"short-acting human insulin; DKA/HHS에서 IV 가능, 피하는 식사 약 30분 전.","Repaglinide":"meglitinide; SUR1/KATP 차단으로 식후 insulin 분비↑, 식사 직전 짧게 사용.","Sitagliptin":"DPP-4 inhibitor→endogenous incretin↑; weight neutral·저혈당 적고 주로 renal excretion.","Atropine":"muscarinic antagonist; organophosphate 중독의 bronchorrhea/bradycardia 등 muscarinic 증상을 치료.","Benzene":"만성 노출→bone marrow suppression·aplastic anemia·leukemia가 대표 독성.","Carbamates":"AChE 가역적 carbamylation; 작용이 짧고 atropine 중심, 2-PAM은 보통 불필요.","Carbon monoxide (CO)":"Hb O2 affinity 약 200배 이상; pulse ox가 속을 수 있어 CO-oximetry, 치료는 100% O2±HBO.","DDT / organochlorines":"지용성·환경잔류·biomagnification; Na channel inactivation 지연으로 CNS 흥분/경련.","Margin of safety (MOS)":"LD1/ED99처럼 극단부를 비교하는 더 엄격한 안전성 지표.","MOE / exposure MOS":"NOAEL 또는 BMDL ÷ 실제 인체노출; 클수록 안전 여유가 크다.","Nitrogen dioxide / Ozone (NO2 / O3)":"수용성이 낮아 깊은 폐까지 도달해 지연성 pulmonary edema/손상을 유발.","Organophosphates":"AChE 비가역적 phosphorylation→cholinergic crisis; atropine+2-PAM, aging 전 치료.","Paraquat":"redox cycling ROS→치명적 pulmonary fibrosis; 특이해독제 없고 불필요한 고농도 O2를 피한다.","PCBs":"persistent organic pollutant; 지용성·생물농축·분해저항성이 핵심.","Poisons (독)":"소량으로도 심각한 질병·사망을 일으킬 수 있는 독성물질을 임상적으로 지칭.","Pralidoxime (2-PAM)":"phosphorylated AChE를 aging 전에 재활성화; organophosphate 중독에서 조기 투여가 핵심.","Pregnancy category X":"태아 위험이 이득보다 명백히 큰 고전적 분류; isotretinoin 등은 임신에서 절대 금기.","Pseudocholinesterase deficiency":"succinylcholine 대사 지연→장시간 마비/무호흡이 지속되는 대표 idiosyncrasy.","Sulfur dioxide (SO2)":"수용성이 높아 상기도를 즉시 자극해 노출 경고가 빠른 가스.","Therapeutic index (TI)":"TD50/ED50; 값이 클수록 일반적으로 안전역이 넓다.","Toluene":"solvent abuse에서 CNS/소뇌 증상·RTA; benzene처럼 골수억제/백혈병이 핵심은 아님.","Toxicants (독물)":"생물·화학·물리적 유해물질을 넓게 지칭하는 가장 포괄적 개념.","Toxins (독소)":"생물체가 만들어내는 독성물질을 뜻하며 poison보다 기원에 초점.","Type A ADR (Augmented)":"용량의존적·예측가능·약리작용의 연장; 흔하지만 상대적으로 치명률은 낮다.","Type B ADR (Bizarre)":"용량비의존·예측불가·면역/유전 관련; 드물지만 심각해 보통 약 중단이 원칙.","Type IV hypersensitivity":"T-cell mediated delayed hypersensitivity; 보통 48–72시간 후 나타나는 지연형 반응.","U-shaped dose-response":"필수 미량원소처럼 너무 적어도, 너무 많아도 독성이 생기는 용량-반응 형태.","중독 치료 5원칙":"ABC 안정화→toxidrome/원인 확인→흡수 제거→antidote→supportive care 순서가 기본.","Amyl nitrite / Sodium nitrite":"methemoglobin을 만들어 cyanide를 묶는 고전적 해독 전략; CO 동반 연기흡입에선 주의.","Arsenic (As)":"SH enzyme 억제; acute rice-water diarrhea/garlic odor, chronic Mees lines·암; BAL이 고전적 해독제.","Calcium disodium edetate (CaNa2EDTA)":"parenteral lead chelator; Na2EDTA가 아니라 CaNa2EDTA를 써야 치명적 hypocalcemia를 피한다.","Cyanide":"cytochrome oxidase Fe3+ 억제→cellular respiration 차단; 고전적 nitrite+thiosulfate, 현재 hydroxocobalamin도 핵심.","Deferoxamine":"iron chelator; acute iron poisoning에서 IV, 소변 wine-red 가능·급속주입 hypotension 주의.","Dimercaprol (BAL)":"SH chelator; acute As/Hg/Au 및 severe Pb에서 사용, IM oil 제형·독성이 커 제한적.","Inorganic mercury (Hg2+)":"부식성 GI 손상+신세뇨관 독성/AKI가 중심; chelation 고려.","Iron overdose":"초기 GI 출혈 뒤 잠복기 후 shock/간부전 가능; deferoxamine이 해독제.","Lead (Pb)":"ALAD/ferrochelatase 억제→microcytic anemia; wrist drop·basophilic stippling·Burton line.","Methylmercury":"CNS·태아신경독성; Minamata/Hunter-Russell syndrome의 대표 원인.","Penicillamine":"Cu chelator; Wilson disease 대표 약, nephrotoxicity·pancytopenia·SLE-like·B6 결핍 주의.","Sodium thiosulfate":"sulfur donor로 cyanide→thiocyanate 전환을 촉진하는 고전적 antidote.","Strychnine":"spinal glycine receptor antagonist→stimulus-induced generalized spasm/opisthotonus; 의식은 보존, diazepam+자극차단.","Succimer (DMSA)":"경구 water-soluble chelator; 소아/성인 lead poisoning의 대표 1차 약, BAL보다 안전."};

function isDirectMechanismLead(segment){
  const s=String(segment||"").trim();
  if(!s) return false;
  // 수용체/효소 표적을 바로 주는 표현은 처음 단서에서 숨긴다.
  return /(agonist|antagonist|partial agonist|inverse agonist|inhibitor|receptor|수용체|효현|효능|길항|차단제|억제제|anti-[A-Za-z0-9βγα-]+|cox-?\d?|5-lox|xanthine oxidase|dpp-?4|sglt2|jak\d?|dhod[h]?|tpo|cyp\d|11β-hydroxylase|3β-hsd|calcineurin|aChE)/i.test(s);
}

function cleanCuratedForPrimary(line){
  const parts=String(line||"")
    .split(";")
    .map(x=>x.trim())
    .filter(Boolean);

  const kept=[];
  for(let part of parts){
    // "5-HT2A partial agonist로 강한 환각..." 같은 문장은
    // 직접 표적 부분만 제거하고 뒤의 임상적 특징은 남긴다.
    part=part
      .replace(/^.*?\b(?:partial\s+agonist|inverse\s+agonist|agonist|antagonist|inhibitor)\b(?:로|으로)?\s*/i,"")
      .replace(/^.*?(?:효현제|효능제|길항제|억제제|차단제)(?:로|으로)?\s*/,"");

    if(!part) continue;
    if(isDirectMechanismLead(part) && parts.length>1) continue;
    kept.push(part);
  }
  return kept.join(" / ");
}

function compactReversePrimaryClue(d){
  const curatedLine=REVERSE_CURATED_LINES[d.name] || "";
  const use=(quizUse(d)||"").trim();
  const primaryFromCurated=cleanCuratedForPrimary(curatedLine);

  // 가장 먼저 임상상황/적응증을 보여주고,
  // 새로 만든 시험 한 줄에서 직접 기전을 뺀 hallmark를 덧붙인다.
  const pieces=[];
  if(use) pieces.push(use);
  if(primaryFromCurated && !pieces.some(x=>optionEquivalenceKey(x)===optionEquivalenceKey(primaryFromCurated))){
    pieces.push(primaryFromCurated);
  }

  let text=pieces.join(" / ");
  if(!text) text=curatedLine || quizKeyline(d) || quizClassification(d);

  // 과하게 긴 문제는 시험형 단서 수준으로만 잘라낸다.
  return text.length>180 ? text.slice(0,180)+"…" : text;
}

function reverseExtraHint(d){
  const mech=(quizMechanism(d)||"").trim();
  const cls=(quizClassification(d)||"").trim();

  if(mech && cls && optionEquivalenceKey(mech)!==optionEquivalenceKey(cls)){
    return `${cls} / ${mech}`;
  }
  return mech || cls || "추가 기전 정보 없음";
}

function reverseCuratedLine(d){
  return REVERSE_CURATED_LINES[d.name] || quizKeyline(d) || "";
}

function reverseClue(d){
  const ctx=getContext();
  ctx.reverseClueType="exam";
  return {
    type:"exam",
    label:"시험형 핵심 단서",
    text:compactReversePrimaryClue(d),
    extra:reverseExtraHint(d),
    full:reverseCuratedLine(d)
  };
}
function uniqueDrugRowsByName(arr){
  const seen=new Set();
  const out=[];
  for(const d of arr){
    if(seen.has(d.name)) continue;
    seen.add(d.name);
    out.push(d);
  }
  return out;
}

function reverseScopePool(
  importance=record.settings.importance,
  selectedPpts=record.settings.selectedPpts
){
  let scope=importancePool(importance,selectedPpts);

  // 정보→약물에서는 '중요'를 버리고 최우선 이상만 사용.
  if(appMode==="reverse"){
    scope=scope.filter(d=>d.priority==="최우선" || d.examTier==="red40" || d.examTier==="ultra96");
  }
  return uniqueDrugRowsByName(scope);
}

function reverseOptions(d,clue){
  const answer=d.name;
  const scope=reverseScopePool();

  const sameLecture=scope
    .filter(x=>x.name!==answer && sharesLecture(x,d))
    .map(x=>x.name);
  const all=scope
    .filter(x=>x.name!==answer)
    .map(x=>x.name);

  return distractorOptions(answer,sameLecture,all);
}
function quizClassification(d){
  const c=d.classification;

  // N09/N10 같은 약의 분류 표기 통일.
  if(["Raloxifene","Bazedoxifene"].includes(d.name) &&
     ["SERM","SERM / antiresorptive"].includes(c)){
    return "SERM";
  }

  // 같은 약을 강의마다 다르게 적은 표현은 하나로 통일.
  if(d.name==="Cyproheptadine" &&
     ["1세대 H1 + 5-HT2 antagonist","5-HT2 + H1 antagonist"].includes(c)){
    return "H1 + 5-HT2 antagonist";
  }
  if(["Bromocriptine","Cabergoline"].includes(d.name) &&
     ["Ergot D2 agonist","D2 agonist (ergot)"].includes(c)){
    return "Ergot D2 agonist";
  }
  if(d.name==="Desmopressin (DDAVP)" &&
     ["V2-selective vasopressin analog","V2-selective analog"].includes(c)){
    return "V2-selective vasopressin analog";
  }

  // NSAID 강의록 표현을 그대로 사용.
  if(["N05","N06"].includes(d.ppt) &&
     ["Celecoxib","Etoricoxib","Polmacoxib","Rofecoxib","Valdecoxib","Lumiracoxib"].includes(d.name)){
    return "선택적 COX-2 억제제";
  }

  return c;
}
function quizMechanism(d){
  const m=d.mechanism;

  // N09/N10 SERM의 동일 약물 표현 통일.
  if(d.name==="Raloxifene" &&
     ["뼈 ER 작용; 유방 길항; 자궁내막 무작용","뼈 ER 작용 → bone resorption↓; 자궁·유방 길항"].includes(m)){
    return "뼈 ER 작용; 유방·자궁내막 길항";
  }
  if(d.name==="Bazedoxifene" &&
     ["뼈 ER 작용; 자궁·유방 ER 길항","뼈 ER 작용; 자궁·유방 길항"].includes(m)){
    return "뼈 ER 작용; 자궁·유방 길항";
  }

  // N01 Histamine
  if(d.ppt==="N01" && d.classification==="Mast-cell stabilizer" &&
     ["비만세포 안정화 → histamine/LT 유리 억제","비만세포 탈과립 억제"].includes(m)){
    return "비만세포 안정화 → histamine/LT 유리 억제";
  }
  if(d.ppt==="N01" && d.classification==="1세대 H1 inverse agonist" &&
     ["H1 + 항무스카린","H1 차단 + 항무스카린"].includes(m)){
    return "H1 차단 + 항무스카린";
  }
  if(d.ppt==="N01" && d.classification==="H2 antagonist" &&
     ["벽세포 H2 경쟁적 차단","벽세포 H2 차단"].includes(m)){
    return "벽세포 H2 차단";
  }
  if(d.ppt==="N01" && d.classification==="구 2세대 H1 antagonist" &&
     ["CYP3A4 대사","CYP3A4 관련"].includes(m)){
    return "CYP3A4 대사";
  }
  if(d.ppt==="N01" &&
     ["Histamine release 유발약","강력한 histamine release 유발약"].includes(d.classification) &&
     ["비면역학적 비만세포 histamine 유리","직접 histamine 유리"].includes(m)){
    return "비면역학적 직접 histamine 유리";
  }

  // 같은 약이 다른 강의에서 표현만 달라진 경우.
  if(d.name==="Cyproheptadine" &&
     ["H1/serotonin 차단","5-HT2 차단"].includes(m)){
    return "H1 + 5-HT2 차단";
  }
  if(d.name==="Oxytocin" &&
     ["oxytocin receptor 작용","oxytocin receptor 자극"].includes(m)){
    return "oxytocin receptor 자극";
  }
  if(d.name==="Zileuton" &&
     ["5-lipoxygenase 억제","5-LOX 억제"].includes(m)){
    return "5-LOX 억제";
  }
  if(d.name==="Misoprostol" &&
     ["PGE1 작용","위점막 보호"].includes(m)){
    return "PGE1 작용 → 위점막 보호";
  }
  if(d.name==="Glucocorticoids" &&
     ["Annexin A1↑ → PLA2 억제 + COX-2 발현 억제","PLA2 억제"].includes(m)){
    return "PLA2 억제";
  }

  // N02 5-HT / Ergot
  if(d.ppt==="N02" && d.classification==="Ergot D2 agonist" &&
     ["뇌하수체 D2 자극 → prolactin↓","D2 자극 → prolactin↓"].includes(m)){
    return "뇌하수체 D2 자극 → prolactin↓";
  }

  // N04 Vasoactive peptides
  if(d.ppt==="N04" && d.classification==="ACE inhibitor" &&
     ["Ang I→II 차단 + bradykinin 분해↓","Ang I→II 차단 + bradykinin↑"].includes(m)){
    return "Ang I→II 차단 + bradykinin↑";
  }
  if(d.ppt==="N04" &&
     ["ARB / AT1 antagonist","ARB"].includes(d.classification) &&
     ["AT1 경쟁적 차단","AT1 차단"].includes(m)){
    return "AT1 차단";
  }

  // 비선택 NSAID의 같은 기전 표현을 통일.
  if(["N03","N05","N06"].includes(d.ppt) &&
     ["Indomethacin","Ibuprofen","Diclofenac","Diflunisal","Fenoprofen","Flurbiprofen",
      "Ketorolac","Naproxen","Oxaprozin","Phenylbutazone","Tolmetin"].includes(d.name) &&
     ["COX-1/2 비선택 억제","비선택 COX 억제","S(-) 비선택 COX 억제","COX 억제"].includes(m)){
    return "COX-1/2 비선택 억제";
  }
  if(d.name==="Piroxicam" &&
     ["COX-1 우세/비선택","비선택 COX 억제"].includes(m)){
    return "비선택 COX 억제 (COX-1 우세)";
  }

  // Coxib 핵심 기전은 전 강의에서 동일 표기.
  if(["Celecoxib","Etoricoxib","Polmacoxib","Rofecoxib","Valdecoxib","Lumiracoxib"].includes(d.name) &&
     ["COX-2 선택 억제","COX-2 선택성 높음","COX-2 억제"].includes(m)){
    return "COX-2 선택 억제";
  }

  // N06 DMARD
  if(d.ppt==="N06" && d.classification==="csDMARD/calcineurin inhibitor" &&
     ["T-cell 기능 억제","T-cell 억제"].includes(m)){
    return "T-cell 기능 억제";
  }
  if(d.ppt==="N06" && d.classification==="Anti-TNF bDMARD" &&
     ["human anti-TNF-α mAb","human anti-TNF mAb"].includes(m)){
    return "human anti-TNF-α mAb";
  }

  // N07 Pituitary / obesity
  if(d.ppt==="N07" && d.classification==="Old anti-obesity serotonergic drug" &&
     ["중추 serotonergic 식욕억제","serotonergic 식욕억제"].includes(m)){
    return "중추 serotonergic 식욕억제";
  }
  if(d.ppt==="N07" && d.classification==="GLP-1 receptor agonist" &&
     ["식욕중추 작용 + 위배출 지연","식욕↓ + 위배출 지연"].includes(m)){
    return "식욕↓ + 위배출 지연";
  }
  if(d.ppt==="N07" &&
     ["Somatostatin analog","Long-acting somatostatin analog"].includes(d.classification) &&
     ["SSTR2/5 agonist → GH 분비↓","SSTR agonist"].includes(m)){
    return "SSTR agonist → GH 분비↓";
  }

  // N08 Thyroid
  if(d.ppt==="N08" && d.classification==="Anion NIS inhibitor" &&
     ["NIS 경쟁 차단","NIS에서 iodide와 경쟁 → trapping↓"].includes(m)){
    return "NIS 경쟁 차단 → iodide trapping↓";
  }
  if(d.ppt==="N08" &&
     ["Bile-acid sequestrant","LT4 absorption inhibitor"].includes(d.classification) &&
     ["LT4 장흡수↓","LT4 흡수 방해"].includes(m)){
    return "LT4 장흡수↓";
  }

  return m;
}
function quizUse(d){
  const u=d.use;

  // N01: 같은 적응증을 쉼표/슬래시/수식어 차이로 따로 내지 않음.
  if(d.ppt==="N01" && d.classification==="Mast-cell stabilizer" &&
     ["천식 예방, 알레르기","천식 예방, 알레르기 결막염"].includes(u)){
    return "천식 예방, 알레르기";
  }
  if(d.ppt==="N01" && d.classification==="2세대 H1 inverse agonist" &&
     ["알레르기/결막염","알레르기 결막염"].includes(u)){
    return "알레르기 결막염";
  }

  // 같은 약/같은 임상상황인데 순서·띄어쓰기만 다른 표현.
  if(d.name==="Cyproheptadine" &&
     ["식욕증진, serotonin syndrome","Serotonin syndrome, 식욕증진"].includes(u)){
    return "serotonin syndrome, 식욕증진";
  }
  if(d.name==="Oxytocin" && ["산후 출혈","산후출혈"].includes(u)){
    return "산후출혈";
  }
  if(d.ppt==="N02" && ["산후 출혈","산후출혈"].includes(u)){
    return "산후출혈";
  }

  // NSAID의 대표적 '염증/통증' 표현은 한 가지로 통일.
  if(["N03","N05"].includes(d.ppt) &&
     ["염증/통증","항염증/통증","통증/염증","통증/발열/염증"].includes(u)){
    return "염증/통증";
  }
  if(["N05","N06"].includes(d.ppt) && ["항염증","염증"].includes(u)){
    return "염증";
  }

  // 반복 등장하는 GI 보호 약물의 임상상황 표기 통일.
  if(d.name==="Misoprostol" &&
     ["NSAID 유발 위궤양 예방","NSAID 유발 궤양 예방","NSAID GI 보호"].includes(u)){
    return "NSAID 유발 위궤양 예방";
  }
  if(d.name==="Omeprazole" &&
     ["NSAID 관련 궤양 예방/치료","NSAID GI 보호"].includes(u)){
    return "NSAID 관련 궤양 예방/치료";
  }

  // 같은 약이 강의별로 약어/한글이 달라진 경우.
  if(d.name==="Polmacoxib" && ["골관절염","OA"].includes(u)){
    return "OA";
  }
  if(d.name==="Etoricoxib" &&
     ["OA/RA/급성 통풍","OA/RA/gout"].includes(u)){
    return "OA/RA/통풍";
  }

  return u;
}
function quizKeyline(d){

     ["비진정성 위주","비진정성"].includes(k)){

  if(["Fenfluramine","Dexfenfluramine"].includes(d.name) &&
     ["판막병증·폐고혈압 → 철수","폐고혈압·판막병 → 철수","폐고혈압·판막병증 → 철수"].includes(k)){
    return "폐고혈압·판막병증 → 철수";

     ["renin 유리 억제 예시","renin 분비 억제 예시"].includes(k)){

  // Polmacoxib은 공통 coxib 문구보다 고유한 시험 포인트를 남김.
  if(d.name==="Polmacoxib" &&

}
function modeLabel(mode=record.settings.mode){
  return mode==="favorite" ? "★ 즐겨찾기" : mode==="wrong" ? "오답만" : "전체";
}
function importanceLabel(v=record.settings.importance){
  if(v==="red40") return "🔥 마지막 40";
  if(v==="ultra96") return "⚡ 초핵심 96";
  return v==="topOnly" ? "최우선만" : "최우선 + 중요";
}
function studyLabel(v=record.settings.studyLevel){
  return v==="intermediate" ? "중급" : "실전";
}
function lectureScopeLabel(ppts=record.settings.selectedPpts){
  const selected=[...ppts].filter(p=>PPTS.includes(p));
  if(selected.length===PPTS.length) return "전체 강의";
  if(selected.length===1) return topicLabel(selected[0]);
  if(selected.length===2) return selected.map(topicLabel).join(" + ");
  return `${selected.length}개 강의 선택`;
}
function lectureScopeCompact(ppts=record.settings.selectedPpts){
  const selected=[...ppts].filter(p=>PPTS.includes(p));
  if(selected.length===PPTS.length) return "전체 강의";
  if(selected.length===1) return topicLabel(selected[0]);
  return `${selected.length}개 강의`;
}
function activeStages(level=record.settings.studyLevel){
  const singleLecture = record && record.settings && record.settings.selectedPpts.length===1;
  if(level==="intermediate") return singleLecture ? [2,3] : [1,2,3];
  return singleLecture ? [2,3,4,5] : [1,2,3,4,5];
}
function stagesForDrug(d=null, level=record.settings.studyLevel){
  const base=activeStages(level);
  return d && drugPpts(d).length>1 ? base.filter(s=>s!==1) : base;
}
function firstActiveStage(d=null){
  return stagesForDrug(d)[0];
}

function renderHistory(){
  const box=$("historyBox");
  const arr=(record.completedHistory||[]).slice(0,10);
  if(!arr.length){
    box.innerHTML='<div class="note">아직 완료한 항목이 없어.</div>';
    return;
  }
  box.innerHTML=arr.map(x=>{
    const d=new Date(x.time);
    const when=isNaN(d)?"":d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    const star=(record.favorites||[]).includes(x.id)?"★ ":"";
    return `<div class="histrow">${star}<b>${escapeHtml(x.drug)}</b> · ${escapeHtml(x.topic || topicLabel(x.ppt))} · ${escapeHtml(x.priority)}<br><span style="color:#667085">${escapeHtml(x.classification)} · ${when}</span></div>`;
  }).join("");
}

function cleanContextAgainstPool(ctx,pool){
  const valid=new Set(pool.map(d=>d.id));
  ctx.deck=ctx.deck.filter(id=>valid.has(id));
  if(ctx.currentUid && !valid.has(ctx.currentUid)){
    ctx.currentUid=null;ctx.stage=firstActiveStage();ctx.currentHadWrong=false;
  }
}
function initializeRound(ctx,pool){
  ctx.deck=shuffle(pool.map(d=>d.id));
  ctx.currentUid=null;
  ctx.stage=firstActiveStage();
  ctx.currentHadWrong=false;
  ctx.reverseClueType=null;
  ctx.reverseHintShown=false;
  ctx.completedThisRound=0;
  ctx.roundTotal=pool.length;
  ctx.awaitingNextRound=false;
}
function activateContext(){
  completedViewItem=null;
  const pool=getPool();
  if(!pool.length){
    if(record.settings.mode!=="all"){
      record.settings.mode="all";
      saveRecord();
      return activateContext();
    }
    return;
  }
  const ctx=getContext();
  cleanContextAgainstPool(ctx,pool);

  if(ctx.awaitingNextRound){
    current=null;
    showRoundOverlay();
    updateUi();
    return;
  }

  if(!ctx.currentUid){
    if(!ctx.deck.length) initializeRound(ctx,pool);
    if(ctx.deck.length) ctx.currentUid=ctx.deck.shift();
    ctx.stage=firstActiveStage();ctx.currentHadWrong=false;ctx.reverseClueType=null;ctx.reverseHintShown=false;
  }

  current=drugs.find(d=>d.id===ctx.currentUid)||null;
  const currentStages=stagesForDrug(current);
  stage=currentStages.includes(ctx.stage) ? ctx.stage : firstActiveStage(current);
  ctx.stage=stage;
  currentHadWrong=!!ctx.currentHadWrong;
  saveRecord();
  renderStage();
}

function optionEquivalenceKey(x){
  return String(x ?? "")
    .toLowerCase()
    .replace(/[\s,;/·()\-–—]/g,"");
}
function distractorOptions(answer,...pools){
  const chosen=[answer];
  const keys=new Set([optionEquivalenceKey(answer)]);
  for(const pool of pools){
    for(const x of shuffle(unique(pool||[]))){
      const key=optionEquivalenceKey(x);
      if(x!==answer && !keys.has(key)){
        chosen.push(x);
        keys.add(key);
      }
      if(chosen.length===4) return shuffle(chosen);
    }
  }
  return shuffle(chosen);
}
function optionsForStage(){
  // 오답 선지는 직전까지 맞힌 경로를 최대한 유지해서 구성한다.
  if(stage===1){
    const answer=topicLabel(current.ppt);
    const selectedTopics=record.settings.selectedPpts.map(topicLabel);
    return distractorOptions(
      answer,
      selectedTopics
    );
  }

  if(stage===2){
    const sameTopic = drugs
      .filter(d=>sharesLecture(d,current))
      .map(d=>quizClassification(d));
    return distractorOptions(
      quizClassification(current),
      sameTopic,
      drugs.map(d=>quizClassification(d))
    );
  }

  if(stage===3){
    const sameTopicAndClass = drugs
      .filter(d=>sharesLecture(d,current) && quizClassification(d)===quizClassification(current))
      .map(d=>quizMechanism(d));
    const sameTopic = drugs
      .filter(d=>sharesLecture(d,current))
      .map(d=>quizMechanism(d));
    return distractorOptions(
      quizMechanism(current),
      sameTopicAndClass,
      sameTopic,
      drugs.map(d=>quizMechanism(d))
    );
  }

  if(stage===4){
    // 주제 + 분류 + 기전이 같은 약물들의 적응증을 가장 먼저 오답으로 사용.
    const samePath = drugs
      .filter(d=>
        sharesLecture(d,current) &&
        quizClassification(d)===quizClassification(current) &&
        quizMechanism(d)===quizMechanism(current)
      )
      .map(d=>quizUse(d));
    const sameTopicAndClass = drugs
      .filter(d=>sharesLecture(d,current) && quizClassification(d)===quizClassification(current))
      .map(d=>quizUse(d));
    const sameTopic = drugs
      .filter(d=>sharesLecture(d,current))
      .map(d=>quizUse(d));
    return distractorOptions(
      quizUse(current),
      samePath,
      sameTopicAndClass,
      sameTopic,
      drugs.map(d=>quizUse(d))
    );
  }

  // 5단계: 주제 + 분류 + 기전 + 적응증이 같은 약물의 핵심 한 줄을 최우선 사용.
  const sameExactPath = drugs
    .filter(d=>
      sharesLecture(d,current) &&
      quizClassification(d)===quizClassification(current) &&
      quizMechanism(d)===quizMechanism(current) &&
      quizUse(d)===quizUse(current)
    )
    .map(d=>quizKeyline(d));
  const sameTopicAndClass = drugs
    .filter(d=>sharesLecture(d,current) && quizClassification(d)===quizClassification(current))
    .map(d=>quizKeyline(d));
  const sameTopic = drugs
    .filter(d=>sharesLecture(d,current))
    .map(d=>quizKeyline(d));

  return distractorOptions(
    quizKeyline(current),
    sameExactPath,
    sameTopicAndClass,
    sameTopic,
    drugs.map(d=>quizKeyline(d))
  );
}
function answerForStage(){
  if(stage===1) return topicLabel(current.ppt);
  if(stage===2) return quizClassification(current);
  if(stage===3) return quizMechanism(current);
  if(stage===4) return quizUse(current);
  return quizKeyline(current);
}
function stageText(){
  if(stage===1) return "이 약물이 속한 강의 주제를 선택해.";
  if(stage===2) return "약물 분류를 선택해.";
  if(stage===3) return "핵심 기전·표적을 선택해.";
  if(stage===4) return "대표 적응증·임상상황을 선택해.";
  return "마지막으로 꼭 외워야 할 한 줄을 선택해.";

function priorPathText(){
  const parts=[];
  if(stage>1) parts.push(drugTopicText(current));
  if(stage>2) parts.push(quizClassification(current));
  if(stage>3) parts.push(quizMechanism(current));
  if(stage>4) parts.push(quizUse(current));
  return parts.join(" → ");
}

function renderStage(){

      extraBtn.onclick=()=>{
        ctx.reverseHintShown=true;
        extraBtn.style.display="none";
        $("extraHintText").classList.remove("hidden");

      };

    const opts=reverseOptions(current,clue);

    $("opts").classList.remove("pptopts");
    opts.forEach((label,idx)=>{

      b.onclick=()=>choose(b,label);
      $("opts").appendChild(b);
    });
    saveRecord();
    return;
  }

  if(!current) return;
  answered=false;
  const ctx=getContext();
  ctx.stage=stage;ctx.currentHadWrong=currentHadWrong;

  $("drug").textContent=current.name;
  $("priorityBadge").textContent=current.priority;
  $("priorityBadge").className="priority "+(current.priority==="최우선"?"topP":"impP");
  const stages=stagesForDrug(current);
  if(!stages.includes(stage)){
    stage=stages[0];
    ctx.stage=stage;
  }
  const pos=stages.indexOf(stage);
  $("badge").textContent=`${pos+1}단계 / ${stages.length}단계`;
  $("stage").textContent=stageText();
  $("feedback").textContent="";
  $("bar").style.width=`${Math.max(0,pos)/stages.length*100}%`;
  $("path").style.display="none";
  $("nextBtn").style.display="none";

  const hint=$("contextHint");
  if(stage===1 && nameCounts[current.name]>1){
    hint.textContent=`이 약물은 여러 강의 주제에 반복 등장해. 문맥 힌트: ${topicLabel(current.ppt)}`;
    hint.classList.remove("hidden");
  }else if(stage>1){
    hint.textContent=`지금까지 맞힌 경로: ${priorPathText()}`;
    hint.classList.remove("hidden");
  }else{
    hint.classList.add("hidden");
    hint.textContent="";
  }

  const opts=optionsForStage();
  $("opts").innerHTML="";
  $("opts").classList.toggle("pptopts",stage===1);
  opts.forEach((label,idx)=>{
    const b=document.createElement("button");
    const displayKey=String(idx+1);
    b.className="opt";b.dataset.key=displayKey;b._label=label;
    b.innerHTML=`<span class="keynum">${displayKey}.</span> ${escapeHtml(label)}`;
    b.onclick=()=>choose(b,label);
    $("opts").appendChild(b);
  });
  saveRecord();

}
function choose(btn,label){
  if(answered||!current) return;
  answered=true;
  record.attempts++;
  const reverse=appMode==="reverse";
  const ans=reverse ? current.name : answerForStage();
  const buttons=[...document.querySelectorAll(".opt")];
  buttons.forEach(b=>b.disabled=true);

  if(label===ans){
    record.correct++;
    btn.classList.add("correct");
    $("feedback").textContent="정답.";
    saveRecord();

    setTimeout(()=>{
      if(reverse){
        completeCurrent();
        return;
      }
      const stages=stagesForDrug(current);
      const pos=stages.indexOf(stage);
      if(pos < stages.length-1){
        stage=stages[pos+1];
        getContext().stage=stage;
        renderStage();
      }else{
        completeCurrent();
      }
    },430);
  }else{
    currentHadWrong=true;
    getContext().currentHadWrong=true;
    if(!record.wrongIds.includes(current.id)) record.wrongIds.push(current.id);
    btn.classList.add("wrong");
    buttons.find(b=>b._label===ans)?.classList.add("correct");
    $("feedback").textContent=reverse
      ? `정답은 “${ans}”. 같은 단서로 다시 풀어봐.`
      : `정답은 “${ans}”. 같은 단계에서 다시 풀어봐.`;
    saveRecord();
    setTimeout(renderStage,950);
  }
}
function completeCurrent(){
  const ctx=getContext();
  record.completed++;

  if(record.settings.mode==="wrong" && !currentHadWrong){
    record.wrongIds=record.wrongIds.filter(id=>id!==current.id);
  }

  ctx.completedThisRound++;
  ctx.currentUid=null;ctx.stage=firstActiveStage();ctx.currentHadWrong=false;ctx.reverseClueType=null;ctx.reverseHintShown=false;ctx.reverseHintShown=false;

  const pool=getPool();
  cleanContextAgainstPool(ctx,pool);

  record.completedHistory.unshift({
    id:current.id,drug:current.name,ppt:current.ppt,topic:drugTopicText(current),priority:current.priority,
    classification:quizClassification(current),time:new Date().toISOString()
  });
  record.completedHistory=record.completedHistory.slice(0,100);

  const solvedStages=stagesForDrug(current).length;
  $("bar").style.width="100%";
  $("feedback").textContent=appMode==="reverse"
    ? "완료."
    : `완료. ${studyLabel()} 모드의 ${solvedStages}단계를 전부 맞혔어.`;
  $("path").innerHTML=appMode==="reverse"
    ? `<b>시험 한 줄</b><br>${escapeHtml(reverseCuratedLine(current))}`+
      `<br><span style="color:#667085">${escapeHtml(quizClassification(current))} · ${escapeHtml(quizMechanism(current))}</span>`
    : `<b>전체 정답 지도</b><br>`+
      `${escapeHtml(drugTopicText(current))} → ${escapeHtml(quizClassification(current))} → ${escapeHtml(quizMechanism(current))} → ${escapeHtml(quizUse(current)||"-")} → ${escapeHtml(quizKeyline(current))}`+
      `<br><span style="color:#667085">중급에서도 완료 후 전체 경로를 확인할 수 있어.</span>`;
  $("path").style.display="block";
  $("opts").innerHTML="";
  $("contextHint").classList.add("hidden");
  completedViewItem=current;
  current=null;

  if(!ctx.deck.length){
    ctx.awaitingNextRound=true;
    saveRecord();
    setTimeout(showRoundOverlay,280);
  }else{
    $("nextBtn").textContent=record.settings.mode==="wrong"?"다음 오답":"다음 항목";
    $("nextBtn").style.display="block";
    saveRecord();
  }
}
function nextDrug(){
  completedViewItem=null;
  const ctx=getContext();
  if(ctx.awaitingNextRound){ showRoundOverlay(); return; }
  const pool=getPool();
  cleanContextAgainstPool(ctx,pool);
  if(!ctx.deck.length){
    ctx.awaitingNextRound=true;saveRecord();showRoundOverlay();return;
  }
  ctx.currentUid=ctx.deck.shift();
  current=drugs.find(d=>d.id===ctx.currentUid)||null;
  ctx.stage=firstActiveStage(current);ctx.currentHadWrong=false;ctx.reverseClueType=null;ctx.reverseHintShown=false;
  stage=firstActiveStage(current);currentHadWrong=false;
  saveRecord();renderStage();
}

function startNextRound(){
  const ctx=getContext();
  const pool=getPool();
  $("roundOverlay").classList.add("hidden");

  if(!pool.length){
    if(record.settings.mode!=="all"){
      record.settings.mode="all";
      saveRecord();
      return activateContext();
    }
    return;
  }

  ctx.round++;
  ctx.awaitingNextRound=false;
  ctx.roundTotal=0;ctx.completedThisRound=0;
  ctx.deck=[];ctx.currentUid=null;ctx.stage=firstActiveStage();ctx.currentHadWrong=false;
  saveRecord();
  activateContext();
}
$("nextRoundBtn").onclick=startNextRound;

$("resetBtn").onclick=()=>{
  safeRemove(storageKey());
  record=emptyRecord();current=null;completedViewItem=null;stage=firstActiveStage();answered=false;currentHadWrong=false;
  safeSet(storageKey(),JSON.stringify(record));
  $("feedback").textContent="현재 모드 기록을 초기화했어.";
  $("path").style.display="none";$("nextBtn").style.display="none";
  $("roundOverlay").classList.add("hidden");
  updateUi();
  setTimeout(activateContext,320);
};

document.addEventListener("keydown",e=>{
  if(!$("modeScreen").classList.contains("hidden")) return;
  if($("quizScreen").classList.contains("hidden")) return;

  if(!$("roundOverlay").classList.contains("hidden")){
    if(e.key==="Enter"){ e.preventDefault();$("nextRoundBtn").click(); }
    return;
  }

  const numberKeys=["1","2","3","4"];
  if(numberKeys.includes(e.key) && !answered){
    const btn=document.querySelector(`.opt[data-key="${e.key}"]`);
    if(btn && !btn.disabled){ e.preventDefault();btn.click(); }
    return;
  }
  if(e.key==="Enter" && $("nextBtn").style.display!=="none"){
    e.preventDefault();$("nextBtn").click();
  }
});

window.addEventListener("beforeunload",saveRecord);
$("chooseForwardBtn").focus();
</script>
